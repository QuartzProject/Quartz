name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Plan the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              .github/scripts/plan-version.sh release
          else
              .github/scripts/plan-version.sh ci
          fi

  linux:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-x64
          - os: ubuntu-24.04-arm
            target: Linux-arm64
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      version: ${{ needs.plan.outputs.version }}

  windows:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: Windows-x64
          - os: windows-11-arm
            target: Windows-arm64
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      version: ${{ needs.plan.outputs.version }}

  macos:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macOS-x64
            arch: x86_64
          - os: macos-15
            target: macOS-arm64
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      version: ${{ needs.plan.outputs.version }}

  musl:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-musl-x64
          - os: ubuntu-24.04-arm
            target: Linux-musl-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: build/musl-ccache
          key: ccache-${{ matrix.target }}-clang23-${{ github.sha }}
          restore-keys: ccache-${{ matrix.target }}-clang23-

      - name: Build, test and package on Alpine
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: >-
          docker run --rm -e CCACHE_DIR=/src/build/musl-ccache -e CCACHE_MAXSIZE=800M -v "$PWD:/src" -w /src
          alpine:edge sh .github/scripts/build-musl.sh "$VERSION" "$TARGET"

      - uses: actions/upload-artifact@v7
        with:
          name: quartz-${{ matrix.target }}
          path: dist/*.tar.xz
          if-no-files-found: error

  android:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android-arm64
            abi: arm64-v8a
            machine: AArch64
          - target: Android-x64
            abi: x86_64
            machine: Advanced Micro Devices X86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          job-summary: ''
          max-size: 600M
          key: ${{ matrix.target }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v4

      - name: Install the Android NDK
        run: |
          n=0
          until sdkmanager 'ndk;30.0.16248370'; do
              n=$((n + 1)); [ "$n" -lt 4 ] || exit 1; sleep $((n * 15))
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >>"$GITHUB_ENV"
          sudo apt-get install -y ninja-build

      - name: Configure
        run: >-
          cmake -B build/android -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static
          -DCMAKE_BUILD_TYPE=Release "-DQUARTZ_VERSION=$VERSION" -DQUARTZ_SHARED=ON -DQUARTZ_COMPILER=OFF
          -DQUARTZ_JVM=OFF -DQUARTZ_ANDROID=OFF -DCMAKE_INSTALL_LIBDIR=lib
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/android

      - name: Check the Android executables
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          for binary in build/android/cli/quartz build/android/lsp/quartz-lsp; do
              readelf -h "$binary" | grep -F "$MACHINE"
              readelf -l "$binary" | grep -F /system/bin/linker64
              if readelf -d "$binary" | grep NEEDED | grep -E 'libc\+\+_shared|libstdc\+\+|libgcc_s'; then
                  echo "$binary needs a runtime Android does not ship"; exit 1
              fi
          done

      - name: Enable KVM
        if: matrix.target == 'Android-x64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on Android 10
        if: matrix.target == 'Android-x64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          ram-size: 4096M
          disk-size: 2048M
          script: .github/scripts/test-android.sh build/android

      - name: Package
        run: .github/scripts/package.sh "$VERSION" "${{ matrix.target }}" build/android

      - uses: actions/upload-artifact@v7
        with:
          name: quartz-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  freebsd:
    name: FreeBSD-x64
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          envs: VERSION
          cpu: 4
          mem: 8192
          usesh: true
          prepare: |
            n=0; until pkg install -y cmake ninja llvm23 bash zstd; do n=$((n + 1)); [ $n -lt 4 ] || exit 1; sleep 20; done
          run: |
            set -eu
            llvm=/usr/local/llvm23
            "$llvm/bin/llvm-config" --version | grep -q '^23\.'
            mkdir -p "$HOME/quartz-static"
            for lib in zstd xml2; do
                [ ! -f "/usr/local/lib/lib$lib.a" ] || cp "/usr/local/lib/lib$lib.a" "$HOME/quartz-static/"
            done
            cmake --preset release -DCMAKE_BUILD_TYPE=Release "-DQUARTZ_VERSION=$VERSION" -DQUARTZ_SHARED=ON \
              -DQUARTZ_COMPILER=ON -DQUARTZ_JVM=OFF -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_C_COMPILER="$llvm/bin/clang" \
              -DCMAKE_CXX_COMPILER="$llvm/bin/clang++" -DQUARTZ_LLVM_CONFIG="$llvm/bin/llvm-config" \
              "-DCMAKE_SHARED_LINKER_FLAGS=-L$HOME/quartz-static -L/usr/local/lib" \
              "-DCMAKE_EXE_LINKER_FLAGS=-L$HOME/quartz-static -L/usr/local/lib"
            cmake --build build/release
            ctest --test-dir build/release --output-on-failure
            .github/scripts/package.sh "$VERSION" FreeBSD-x64 build/release

      - uses: actions/upload-artifact@v7
        with:
          name: quartz-FreeBSD-x64
          path: dist/
          if-no-files-found: error

  freebsd-arm64:
    name: FreeBSD-arm64
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          job-summary: ''
          max-size: 800M
          key: FreeBSD-arm64-cross

      - name: Select the cross-compiler
        run: .github/scripts/select-compiler.sh

      - name: Extract the FreeBSD arm64 sysroot
        run: .github/scripts/setup-freebsd-sysroot.sh "$RUNNER_TEMP/freebsd-sysroot"

      - name: Configure
        run: |
          root="$RUNNER_TEMP/freebsd-sysroot"
          cmake -B build/freebsd -G Ninja -DCMAKE_BUILD_TYPE=Release "-DQUARTZ_VERSION=$VERSION" -DQUARTZ_SHARED=ON \
            -DQUARTZ_COMPILER=ON -DQUARTZ_JVM=OFF -DQUARTZ_ANDROID=OFF -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23 -DCMAKE_STRIP=/usr/lib/llvm-23/bin/llvm-strip \
            -DCMAKE_SYSTEM_NAME=FreeBSD -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER_TARGET=aarch64-unknown-freebsd14.5 -DCMAKE_CXX_COMPILER_TARGET=aarch64-unknown-freebsd14.5 \
            "-DCMAKE_SYSROOT=$root" -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
            "-DLLVM_DIR=$root/usr/local/llvm23/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY

      - name: Cross-build
        run: cmake --build build/freebsd

      - name: Check the binaries need only the base system
        run: |
          for binary in build/freebsd/cli/quartz build/freebsd/lsp/quartz-lsp build/freebsd/compiler/libquartz_compiler.so; do
              readelf -h "$binary" | grep -F AArch64
              readelf -d "$binary" | grep NEEDED
              if readelf -d "$binary" | grep NEEDED | grep -v -E 'lib(thr|c\+\+|cxxrt|m|gcc_s|c|z|quartz)\.so'; then
                  echo "$binary needs a package"; exit 1
              fi
          done

      - name: Package
        run: .github/scripts/package.sh "$VERSION" FreeBSD-arm64 build/freebsd

      - name: Test on FreeBSD arm64
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.5'
          arch: aarch64
          cpu: 4
          mem: 8192
          usesh: true
          copyback: false
          prepare: |
            n=0; until pkg install -y cmake; do n=$((n + 1)); [ $n -lt 4 ] || exit 1; sleep 20; done
          run: |
            set -eu
            ctest --test-dir build/freebsd --output-on-failure --timeout 900
            mkdir check && tar -xJf dist/*.tar.xz -C check
            check/*/bin/quartz --version
            printf 'fn main() {\n    print("ok")\n}\n' > check/hello.qz
            check/*/bin/quartz run check/hello.qz | grep -qx ok

      - uses: actions/upload-artifact@v7
        with:
          name: quartz-FreeBSD-arm64
          path: dist/
          if-no-files-found: error

  wasm:
    name: WebAssembly
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
          actions-cache-folder: emsdk-cache

      - name: Build
        run: |
          sudo apt-get install -y ninja-build
          cmake --preset wasm "-DQUARTZ_VERSION=${{ needs.plan.outputs.version }}"
          cmake --build build/wasm

      - name: Test
        run: ctest --test-dir build/wasm --output-on-failure

      - name: Package
        run: |
          name="quartz-${{ needs.plan.outputs.version }}-WebAssembly"
          mkdir -p "dist/$name"
          cp build/wasm/wasm/*.js build/wasm/wasm/*.wasm wasm/quartz-api.d.ts LICENSE "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name" && rm -rf "$name")

      - uses: actions/upload-artifact@v7
        with:
          name: quartz-WebAssembly
          path: dist/
          if-no-files-found: error

  jvm:
    name: JVM
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          job-summary: ''
          max-size: 400M
          key: jvm-gcc15

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Configure
        run: >-
          eval cmake --preset release -DCMAKE_BUILD_TYPE=Release "-DQUARTZ_VERSION=${{ needs.plan.outputs.version }}"
          -DQUARTZ_SHARED=ON -DQUARTZ_COMPILER=OFF -DQUARTZ_JVM=ON -DQUARTZ_ANDROID=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache $QUARTZ_CMAKE_ARGS

      - name: Build
        run: cmake --build build/release --target quartz_shared quartz-jvm

      - name: Test
        run: ctest --test-dir build/release -L jvm --output-on-failure

      - name: Package
        run: |
          name="quartz-${{ needs.plan.outputs.version }}-JVM"
          mkdir -p "dist/$name"
          find build/release/jvm -path '*/libs/*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} "dist/$name/" \;
          cp LICENSE "dist/$name/"
          ls "dist/$name"
          (cd dist && zip -qr "$name.zip" "$name" && rm -rf "$name")

      - uses: actions/upload-artifact@v7
        with:
          name: quartz-JVM
          path: dist/
          if-no-files-found: error

  sanitize:
    name: Sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          job-summary: ''
          max-size: 400M
          key: sanitize-gcc15

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Configure with the address and undefined sanitizers
        run: >-
          cmake --preset asan -DQUARTZ_COMPILER=OFF -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/asan

      - name: Test
        run: ctest --test-dir build/asan --output-on-failure

  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [plan, linux, musl, windows, macos, android, freebsd, freebsd-arm64, wasm, jvm, sanitize]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: quartz-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh "${{ needs.plan.outputs.version }}" "$GITHUB_SHA" artifacts
